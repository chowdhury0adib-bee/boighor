<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — BoiGhor</title>
<meta name="description" content="Create a free BoiGhor account to start buying and selling secondhand books.">
<meta name="theme-color" content="#16281c">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="apple-touch-icon" href="/img/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site"><div class="wrap" id="siteNav"></div></header>

<main class="wrap" style="padding-top:40px;">
  <div class="page-head" style="text-align:center; border:none;">
    <span class="eyebrow">New here?</span>
    <h1>Create your BoiGhor account</h1>
  </div>

  <form class="card-form" id="signupForm">
    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="university">University</label>
        <input type="text" id="university" placeholder="e.g. DIU">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="01XXXXXXXXX">
      </div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
      <div class="pw-strength" id="pwStrength" hidden aria-live="polite">
        <div class="pw-strength-bar"><span id="pwStrengthFill"></span></div>
        <small class="pw-strength-label" id="pwStrengthLabel">Strength: —</small>
      </div>
    </div>
    <button class="btn" type="submit" style="width:100%; justify-content:center;">Create Account</button>
    <div class="form-msg" id="msg"></div>
    <p style="text-align:center; margin-top:16px; font-size:.9rem;">
      Already have an account? <a href="/login.html" style="color:var(--rust); font-weight:600;">Log in</a>
    </p>
  </form>
</main>

<footer class="site"><div class="wrap" id="siteFooter"></div></footer>

<script src="/js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const user = await initLayout();
  if (user) { window.location.href = '/dashboard.html'; return; }

  const form = document.getElementById('signupForm');
  const submitBtn = form.querySelector('button[type="submit"]');
  const pw = document.getElementById('password');
  const pwWrap = document.getElementById('pwStrength');
  const pwFill = document.getElementById('pwStrengthFill');
  const pwLabel = document.getElementById('pwStrengthLabel');

  // ---- Password strength meter (live) ----
  function scorePassword(s) {
    if (!s) return 0;
    let score = 0;
    if (s.length >= 8)  score++;
    if (s.length >= 12) score++;
    if (/[A-Z]/.test(s)) score++;
    if (/[a-z]/.test(s)) score++;
    if (/[0-9]/.test(s)) score++;
    if (/[^A-Za-z0-9]/.test(s)) score++;
    return Math.min(4, score); // 0..4
  }
  const labels = ['Very weak', 'Weak', 'Fair', 'Good', 'Strong'];
  pw.addEventListener('input', () => {
    const v = pw.value;
    if (!v) { pwWrap.hidden = true; return; }
    pwWrap.hidden = false;
    const s = scorePassword(v);
    pwFill.style.width = ((s / 4) * 100) + '%';
    pwFill.dataset.level = s;
    pwWrap.dataset.level = s;
    pwLabel.textContent = 'Strength: ' + labels[s];
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = 'form-msg';
    submitBtn.disabled = true;
    const original = submitBtn.textContent;
    submitBtn.textContent = 'Creating account…';
    try {
      await api('/api/auth/signup', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          university: document.getElementById('university').value,
          phone: document.getElementById('phone').value,
          password: pw.value
        })
      });
      toast('Welcome to BoiGhor!', 'success');
      setTimeout(() => { window.location.href = '/'; }, 400);
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add('error');
      submitBtn.disabled = false;
      submitBtn.textContent = original;
    }
  });
});
</script>
</body>
</html>
