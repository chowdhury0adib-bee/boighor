<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — BoiGhor</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site"><div class="wrap" id="siteNav"></div></header>

<main class="wrap" style="padding-top:40px;">
  <div class="page-head" style="text-align:center; border:none;">
    <span class="eyebrow">New here?</span>
    <h1>Create your BoiGhor account</h1>
  </div>

  <form class="card-form" id="signupForm">
    <div class="field">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="row-2">
      <div class="field">
        <label for="university">University</label>
        <input type="text" id="university" placeholder="e.g. DIU">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="01XXXXXXXXX">
      </div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6">
    </div>
    <button class="btn" type="submit" style="width:100%; justify-content:center;">Create Account</button>
    <div class="form-msg" id="msg"></div>
    <p style="text-align:center; margin-top:16px; font-size:.9rem;">
      Already have an account? <a href="/login.html" style="color:var(--rust); font-weight:600;">Log in</a>
    </p>
  </form>
</main>

<footer class="site"><div class="wrap" id="siteFooter"></div></footer>

<script src="/js/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await initLayout();
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = 'form-msg';
    try {
      await api('/api/auth/signup', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          university: document.getElementById('university').value,
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value
        })
      });
      window.location.href = '/';
    } catch (err) {
      msg.textContent = err.message;
      msg.classList.add('error');
    }
  });
});
</script>
</body>
</html>
